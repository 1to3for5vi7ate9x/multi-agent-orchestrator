name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --dev

      - name: Compile check
        run: uv run python -m compileall -q src

      - name: Run test suites
        run: uv run python tests/run_all.py

      - name: Build distribution
        run: uv build

      - name: CLI smoke test
        run: |
          uv run ml-orchestrator --help
          uv run python -m ml_orchestrator --help
