[project]
name = "ml-agent-orchestrator"
version = "0.3.0"
description = "Closed-loop automated ML experiment engine driven by Claude Code (editor) and Google Antigravity CLI (evaluator), with git-based state decisions, persistent agent sessions, context-rotation memory, an AST code graph and a temporal experiment knowledge graph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ml-agent-orchestrator" }]
keywords = ["ml", "automation", "agents", "claude-code", "antigravity", "experiment"]
dependencies = [
    "rich>=13.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]

[project.scripts]
ml-orchestrator = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "core", "templates"]

[tool.uv]
# External (non-Python) prerequisites, must be on PATH and authenticated:
#   claude — Claude Code CLI        https://claude.com/claude-code
#   agy    — Google Antigravity CLI https://antigravity.google/docs/cli/using
#   git    — any recent version
