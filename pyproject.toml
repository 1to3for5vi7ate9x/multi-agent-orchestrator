[project]
name = "ml-agent-orchestrator"
version = "0.5.0"
description = "Closed-loop, self-improving agent engine: Claude Code, Google Antigravity and OpenAI Codex compete for the Editor seat via blind-tournament judging, a deterministic referee (Haskell decision kernel + verified Python fallback) polices the flow, and git + an objective fitness signal arbitrate every change. Persistent sessions, context-rotation memory, AST code graph, temporal experiment knowledge graph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ml-agent-orchestrator" }]
keywords = ["ml", "automation", "agents", "claude-code", "antigravity",
            "experiment", "vibe-coding", "orchestrator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "rich>=13.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]

[project.scripts]
ml-orchestrator = "ml_orchestrator.main:main"
# Same CLI under the package's own name, so bare `uvx ml-agent-orchestrator`
# works without --from.
ml-agent-orchestrator = "ml_orchestrator.main:main"

[project.urls]
Homepage = "https://github.com/1to3for5vi7ate9x/multi-agent-orchestrator"
Repository = "https://github.com/1to3for5vi7ate9x/multi-agent-orchestrator"
Issues = "https://github.com/1to3for5vi7ate9x/multi-agent-orchestrator/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_orchestrator"]

[tool.pytest.ini_options]
# Load the script-suite bridge (authored by the orchestrator loop itself,
# trial-4 commit c7e6c55) by import path. Deliberately NOT a pytest11
# entry point: that would auto-load the plugin into every pytest run of
# every user who installs this package; addopts scopes it to this repo.
addopts = "-p ml_orchestrator.pytest_plugin"

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# External (non-Python) prerequisites, must be on PATH and authenticated:
#   claude — Claude Code CLI        https://claude.com/claude-code
#   agy    — Google Antigravity CLI https://antigravity.google/docs/cli/using
#   git    — any recent version
